<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>句子小魔法</title>
<style>
:root{
  --bg:#FFF7F0;
  --card:#FFFFFF;
  --ink:#2E2440;
  --ink2:#7C6F91;
  --ink3:#B3A7C4;
  --line:#F3EAF7;
  --orange:#FF7A59;
  --orange-d:#DE5230;
  --blue:#4C8DFF;
  --mint:#22C79A;
  --yellow:#FFC93C;
  --red:#FF6B81;
  --purple:#A78BFA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#EFE3D8;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.phone{
  position:relative;width:100%;max-width:420px;height:100%;
  background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;
}
@media (min-width:540px){
  body{background:radial-gradient(900px 700px at 50% 0%,#FDF3EA 0%,#E8D8CB 55%,#DCC7B8 100%);}
  .phone{
    height:min(890px,95vh);border-radius:48px;
    border:12px solid #241C2E;
    box-shadow:0 50px 90px -25px rgba(46,36,64,.5), 0 0 0 1px rgba(255,255,255,.3) inset;
  }
  .phone::before{
    content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:104px;height:26px;background:#241C2E;border-radius:0 0 16px 16px;z-index:60;
  }
}
#app{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ---------- 顶栏 ---------- */
.top{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
}
.icon-btn{
  width:42px;height:42px;border-radius:15px;border:none;flex:none;
  background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 0 #EFE3EC, 0 6px 14px -6px rgba(46,36,64,.2);
  transition:transform .08s,box-shadow .08s;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 #EFE3EC;}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.top-title{flex:1;font-size:17px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill{
  display:flex;align-items:center;gap:5px;flex:none;
  background:#fff;border-radius:999px;padding:8px 14px;
  font-size:13.5px;font-weight:800;color:#C97B12;
  box-shadow:0 3px 0 #F5E7D6;
}

/* ---------- 滚动 ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 30px;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{width:0;}

/* ---------- 首页 ---------- */
.hello{padding:8px 2px 16px;}
.hello h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-.6px;line-height:1.25;}
.hello h1 em{font-style:normal;color:var(--orange);}
.hello p{margin:6px 0 0;font-size:13.5px;color:var(--ink2);font-weight:500;}

.task{
  position:relative;overflow:hidden;
  border-radius:26px;padding:16px;margin-bottom:20px;
  background:linear-gradient(150deg,#FFC85C 0%,#FF9A5C 55%,#FF7A59 100%);
  box-shadow:0 6px 0 #E0603A, 0 16px 28px -14px rgba(224,96,58,.8);
  display:flex;align-items:center;gap:14px;
  cursor:pointer;border:none;width:100%;text-align:left;font-family:inherit;
  transition:transform .09s,box-shadow .09s;
}
.task:active{transform:translateY(5px);box-shadow:0 1px 0 #E0603A;}
.task::after{
  content:'';position:absolute;right:-30px;top:-40px;width:130px;height:130px;
  background:rgba(255,255,255,.16);border-radius:50%;
}
.task-mascot{flex:none;width:74px;height:74px;}
.task-txt{flex:1;min-width:0;color:#fff;}
.task-txt .k{font-size:11.5px;font-weight:800;opacity:.9;letter-spacing:1.5px;}
.task-txt .v{font-size:20px;font-weight:900;margin:3px 0 4px;letter-spacing:-.3px;}
.task-txt .d{font-size:12.5px;font-weight:600;opacity:.92;}
.task-go{
  flex:none;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(150,60,30,.25);
}
.task-go svg{width:20px;height:20px;stroke:#FF6B45;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px;}
.sec span{font-size:16px;font-weight:900;letter-spacing:-.3px;}
.sec small{font-size:12px;color:var(--ink3);font-weight:600;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mod{
  position:relative;border:none;cursor:pointer;text-align:left;overflow:hidden;
  border-radius:22px;padding:14px 13px 12px;font-family:inherit;color:#fff;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 5px 0 var(--cd), 0 12px 22px -12px var(--cd);
  transition:transform .09s,box-shadow .09s;
  text-shadow:0 1px 2px rgba(0,0,0,.13);
}
.mod:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd);}
.mod::after{
  content:'';position:absolute;right:-24px;bottom:-30px;width:90px;height:90px;
  background:rgba(255,255,255,.13);border-radius:50%;
}
.mod-ico{
  width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:rgba(255,255,255,.26);margin-bottom:9px;
  box-shadow:0 2px 0 rgba(0,0,0,.08) inset;
}
.mod-name{font-size:15px;font-weight:900;letter-spacing:-.2px;line-height:1.25;}
.mod-sub{font-size:10.5px;font-weight:600;opacity:.82;margin-top:3px;height:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.mod-bar{height:6px;border-radius:99px;background:rgba(0,0,0,.13);overflow:hidden;margin-top:10px;position:relative;z-index:1;}
.mod-bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .5s cubic-bezier(.3,1,.4,1);}
.mod-num{font-size:10px;font-weight:800;opacity:.9;margin-top:5px;position:relative;z-index:1;}

/* ---------- 讲解页 ---------- */
.lsn-head{padding:4px 2px 16px;}
.lsn-head .tag{
  display:inline-block;font-size:11px;font-weight:800;padding:5px 11px;border-radius:9px;
  background:var(--c1);color:#fff;margin-bottom:10px;letter-spacing:.3px;
}
.lsn-head h2{margin:0 0 5px;font-size:23px;font-weight:900;letter-spacing:-.5px;}
.lsn-head p{margin:0;font-size:13px;color:var(--ink2);font-weight:500;}

.lcard{
  background:#fff;border-radius:20px;padding:16px 15px;margin-bottom:11px;
  box-shadow:0 3px 0 #F3EAF7, 0 10px 22px -16px rgba(46,36,64,.5);
  border-top:4px solid var(--c1);
}
.lcard h3{margin:0 0 7px;font-size:15px;font-weight:900;letter-spacing:-.2px;}
.lcard p{margin:0 0 10px;font-size:12.8px;line-height:1.7;color:var(--ink2);font-weight:500;}
.eg{background:#FBF7FE;border-radius:12px;padding:9px 11px;margin-top:7px;}
.eg .en{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.55;word-break:break-word;}
.eg .cn{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5;font-weight:500;}

/* ---------- 底部按钮 ---------- */
.foot{
  flex:none;padding:10px 18px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 60%,rgba(255,247,240,0));
}
.btn{
  width:100%;height:56px;border:none;border-radius:20px;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:900;color:#fff;letter-spacing:.6px;
  background:linear-gradient(180deg,#FF8F6B,#FF6B45);
  box-shadow:0 5px 0 #D9502F, 0 14px 24px -10px rgba(255,107,69,.75);
  transition:transform .08s,box-shadow .08s,background .2s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D9502F,0 4px 10px -6px rgba(255,107,69,.5);}
.btn.ok{background:linear-gradient(180deg,#3FE0B0,#22C79A);box-shadow:0 5px 0 #12A87E,0 14px 24px -10px rgba(34,199,154,.7);}
.btn.ok:active{box-shadow:0 1px 0 #12A87E;}
.btn.ghost{background:#fff;color:var(--ink2);box-shadow:0 4px 0 #EFE3EC,0 10px 18px -12px rgba(46,36,64,.4);}
.btn.ghost:active{box-shadow:0 1px 0 #EFE3EC;}
.btn.sm{height:44px;font-size:15px;border-radius:16px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* ---------- 练习页 ---------- */
.dots{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;}
.dots i{
  width:8px;height:8px;border-radius:50%;background:#F0E4EC;flex:none;
  transition:background .3s,width .3s;
}
.dots i.done{background:var(--c1);}
.dots i.now{background:var(--c1);width:24px;border-radius:99px;}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 12px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;position:relative;}
.qbody::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,122,89,.09) 1.4px, transparent 1.4px);
  background-size:24px 24px;
}
.qbody > *{position:relative;z-index:1;}
.qbody::-webkit-scrollbar{width:0;}

.qcard{
  background:#fff;border-radius:22px;padding:18px 16px;
  box-shadow:0 4px 0 #F3EAF7, 0 14px 26px -18px rgba(46,36,64,.55);
  animation:slideUp .32s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.qinst{
  display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;
  padding:5px 10px;border-radius:8px;background:var(--c1);color:#fff;margin-bottom:11px;
}
.qtext{font-size:20px;line-height:1.6;font-weight:700;color:var(--ink);word-break:break-word;letter-spacing:-.2px;}
.blk{
  display:inline-block;width:48px;height:1.05em;
  border-bottom:3px solid var(--c1,currentColor);opacity:.75;
  vertical-align:-4px;margin:0 3px;border-radius:2px;
}

/* 选项 */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:none;border-radius:18px;
  padding:14px 15px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
  box-shadow:0 4px 0 #F0E6F5, 0 8px 16px -12px rgba(46,36,64,.5);
  transition:transform .09s,box-shadow .09s,background .15s;
}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 #F0E6F5;}
.opt .k{
  width:26px;height:26px;border-radius:9px;background:#F6EFFA;color:var(--ink3);
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .15s,color .15s;
}
.opt.right{background:#E8FBF4;box-shadow:0 4px 0 #B7EFDD;}
.opt.right .k{background:var(--mint);color:#fff;}
.opt.wrong{background:#FFEFF2;box-shadow:0 4px 0 #FFC9D2;}
.opt.wrong .k{background:var(--red);color:#fff;}
.opt.dim{opacity:.55;}
.opt.shake{animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}40%{transform:translateX(7px);}
  60%{transform:translateX(-4px);}80%{transform:translateX(4px);}
}

/* 输入 */
.answrap{margin-top:14px;}
.ansinput{
  width:100%;border:none;border-radius:18px;
  padding:16px 16px;font-size:17px;font-family:inherit;font-weight:700;color:var(--ink);
  outline:none;background:#fff;
  box-shadow:0 4px 0 #F0E6F5, 0 8px 16px -12px rgba(46,36,64,.5);
  transition:box-shadow .15s;
}
.ansinput:focus{box-shadow:0 4px 0 var(--c1), 0 0 0 4px rgba(76,141,255,.13);}
.ansinput:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;background:#FAF6FD;}
.ansinput::placeholder{color:var(--ink3);font-weight:500;font-size:14px;}
.hintline{margin-top:11px;display:flex;align-items:center;gap:9px;min-height:24px;}
.hintbtn{
  border:none;background:#FBF3FF;color:var(--purple);font-family:inherit;
  font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:11px;cursor:pointer;
  box-shadow:0 3px 0 #EFE1F8;
}
.hintbtn:active{transform:translateY(3px);box-shadow:none;}
.hinttxt{font-size:12px;color:var(--orange);font-weight:700;}

/* 词块 */
.slot{
  margin-top:14px;min-height:66px;border-radius:18px;
  padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  background:#FBF5FE;box-shadow:0 0 0 3px #F3EAF7 inset;
}
.slot .ph{font-size:12.5px;color:var(--ink3);padding:8px 4px;font-weight:600;}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;min-height:44px;}
.tok{
  border:none;background:#fff;border-radius:14px;
  padding:11px 15px;font-family:inherit;font-size:15.5px;font-weight:800;color:var(--ink);
  cursor:pointer;box-shadow:0 4px 0 #F0E6F5, 0 8px 14px -10px rgba(46,36,64,.4);
  transition:transform .09s,box-shadow .09s,background .15s;
}
.tok:active{transform:translateY(4px);box-shadow:0 0 0 #F0E6F5;}
.tok.on{background:var(--c1);color:#fff;box-shadow:0 4px 0 var(--cd);}

/* 反馈弹层 */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;
  background:#fff;border-radius:30px 30px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 44px rgba(46,36,64,.2);
  transform:translateY(115%);
  transition:transform .36s cubic-bezier(.2,.95,.3,1.02);
}
.sheet.show{transform:none;}
.sheet-grip{width:42px;height:5px;border-radius:99px;background:#EDE3F3;margin:0 auto 14px;}
.sheet-head{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
.sheet-m{width:52px;height:52px;flex:none;}
.sheet-t{flex:1;min-width:0;}
.sheet-t b{display:block;font-size:18px;font-weight:900;letter-spacing:-.3px;}
.sheet-t span{font-size:12.5px;font-weight:700;color:var(--ink3);}
.sheet-t span.up{color:var(--mint);}
.sheet-body{
  background:#FAF6FD;border-radius:15px;padding:12px 13px;margin-bottom:14px;
  font-size:13px;line-height:1.7;color:var(--ink2);font-weight:500;
}
.sheet-body .ans{
  font-size:15px;font-weight:800;color:var(--ink);line-height:1.5;
  padding-bottom:9px;margin-bottom:9px;border-bottom:1.5px dashed #EADDF2;
}
.sheet-body .ans em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink3);display:block;margin-bottom:3px;letter-spacing:.4px;}

/* 贴底小抄 */
.cheat{margin-top:auto;padding-top:18px;flex:none;}
.cheat-in{
  background:#FBF3FF;border-radius:16px;padding:12px 14px;
  font-size:12px;line-height:1.65;color:var(--ink2);font-weight:500;
}
.cheat-in b{color:var(--c1);font-weight:800;display:block;margin-bottom:3px;font-size:11.5px;letter-spacing:.2px;}

/* ---------- 结果页 ---------- */
.res{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:24px 22px 8px;overflow-y:auto;}
.res::-webkit-scrollbar{width:0;}
.res-mascot{width:110px;height:110px;animation:bounceIn .6s cubic-bezier(.2,1.6,.4,1);}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.res h2{margin:10px 0 4px;font-size:24px;font-weight:900;letter-spacing:-.4px;text-align:center;}
.res .sub{font-size:13px;color:var(--ink2);font-weight:600;margin:0 0 20px;}
.res-stats{display:flex;gap:10px;width:100%;margin-bottom:16px;}
.stat{
  flex:1;background:#fff;border-radius:18px;padding:14px 6px;text-align:center;
  box-shadow:0 4px 0 #F3EAF7;
}
.stat b{display:block;font-size:23px;font-weight:900;line-height:1.15;}
.stat span{font-size:10.5px;color:var(--ink3);font-weight:700;}
.res-wrong{width:100%;margin-bottom:6px;}
.rw{
  background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:8px;
  box-shadow:0 3px 0 #F3EAF7;border-left:4px solid var(--red);
}
.rw .a{font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.5;}
.rw .b{font-size:12.5px;font-weight:800;color:var(--mint);margin-top:4px;line-height:1.5;}
.rw-title{font-size:12.5px;font-weight:800;color:var(--ink3);margin:6px 2px 9px;}

/* 撒花 */
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:999;}

.toast{
  position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(12px);
  background:rgba(46,36,64,.94);color:#fff;font-size:13px;font-weight:700;
  padding:11px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.26s;z-index:99;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.combo{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);
  font-size:34px;font-weight:900;color:var(--orange);opacity:0;pointer-events:none;z-index:80;
  text-shadow:0 4px 0 #fff,0 6px 14px rgba(255,122,89,.5);
}
.combo.pop{animation:comboPop .9s cubic-bezier(.2,1.5,.4,1);}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg);}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg);}
  70%{opacity:1;transform:translate(-50%,-60%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-90%) scale(.9);}
}
</style>
</head>
<body>
<div class="phone">
  <main id="app"></main>
  <div class="toast" id="toast"></div>
  <div class="combo" id="combo"></div>
</div>

<script>
/* ============================================================
   题库：8 关 / 229 题
   每次练习从题库中抽 10 题（错题优先），避免死记答案
   ============================================================ */
function QC(q,o,a,tip){ return {t:'c', q:q, o:o.split('|'), a:a, tip:tip}; }
function QI(q,a,tip,s){ return {t:'i', q:q, a:(typeof a==='string'?[a]:a), tip:tip, s:s?1:0}; }
function QB(q,tok,a,tip){ return {t:'b', q:q, tok:tok.split('|'), a:(typeof a==='string'?[a]:a), tip:tip}; }

const MODULES = [
{
  id:'wh', name:'特殊疑问词', sub:'what / when / where / whose', ico:'🔍',
  c1:'#5B9BFF', c2:'#3D7BF0', cd:'#2A5CC4',
  L:[
    {h:'what 问“什么”', b:'问东西、事情、职业，都用 what。',
      e:[['What is your name?','你叫什么名字？'],['What are these?','这些是什么？'],['What does your father do?','你爸爸做什么工作？']]},
    {h:'when 问“什么时候”', b:'问时间点、日期、星期，用 when。',
      e:[['When do you get up?','你什么时候起床？'],['When is your birthday?','你的生日是什么时候？']]},
    {h:'where 问“在哪里”', b:'问地点、位置，用 where。',
      e:[['Where is my pen?','我的钢笔在哪里？'],['Where are you from?','你来自哪里？']]},
    {h:'which 问“哪一个”', b:'在一定范围里挑选，用 which，常和 one 连用。',
      e:[['Which one do you like?','你喜欢哪一个？'],['Which season do you like best?','你最喜欢哪个季节？']]},
    {h:'whose 问“谁的”', b:'问东西属于谁，用 whose，后面直接跟名词。',

const CONTR = {
  "what's":"what is","it's":"it is","that's":"that is","he's":"he is","she's":"she is",
  "there's":"there is","who's":"who is","where's":"where is","here's":"here is",
  "let's":"let us","i'm":"i am","you're":"you are","we're":"we are","they're":"they are",
  "isn't":"is not","aren't":"are not","don't":"do not","doesn't":"does not","didn't":"did not",
  "can't":"can not","cannot":"can not","won't":"will not","wasn't":"was not","weren't":"were not",
  "i've":"i have","i'll":"i will","you'll":"you will","hasn't":"has not","haven't":"have not",
  "isnt":"is not","arent":"are not","dont":"do not","doesnt":"does not","didnt":"did not",
  "cant":"can not","wont":"will not","wasnt":"was not","werent":"were not","hasnt":"has not",
  "havent":"have not","im":"i am","theyre":"they are","youre":"you are",
  "lets":"let us","whats":"what is","thats":"that is"
};

function norm(s){
  let t = String(s||'').toLowerCase().replace(/[\u2018\u2019`]/g,"'");
  t = t.replace(/[^a-z0-9' ]+/g,' ');
  const out = [];
  t.split(/\s+/).forEach(function(w){
    if(!w) return;
    const r = CONTR[w];
    if(r){ out.push.apply(out, r.split(' ')); } else { out.push(w); }
  });
  return out.join(' ').replace(/'/g,'');
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nl(s){
  return esc(s).replace(/\n/g,'<br>').replace(/_{2,}/g,'<span class="blk"></span>');
}
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function load(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function pad(n){ return n<10?'0'+n:''+n; }

let AC = null;
function ac(){
  if(!AC){
    try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(f, at, dur, type, vol){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.14, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function burst(x, y){
  const colors = ['#FFC93C','#FF7A59','#4C8DFF','#22C79A','#A78BFA','#FF6B81'];
  for(let i=0;i<16;i++){
    const el = document.createElement('div');
    el.className = 'spark';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[i % colors.length];
    const sz = 6 + Math.random()*7;
    el.style.width = sz+'px'; el.style.height = sz+'px';
    document.body.appendChild(el);
    const ang = Math.random()*Math.PI*2;
    const dist = 70 + Math.random()*110;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 40;
    const anim = el.animate([
      { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
      { transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(0.2)', opacity:0 }
    ], { duration: 650 + Math.random()*450, easing:'cubic-bezier(.15,.75,.4,1)' });
    anim.onfinish = function(){ el.remove(); };
  }
}

  void comboEl.offsetWidth;
  comboEl.classList.add('pop');
}
function findMod(id){ for(let i=0;i<MODULES.length;i++){ if(MODULES[i].id===id) return MODULES[i]; } return null; }

/* ============================================================
   抽题：错题优先
   ============================================================ */
function pickQuestions(mid, n){
  const mod = findMod(mid);
  const all = mod.Q.map(function(q,i){
    const st = state.qstat[mid+'-'+i] || {w:0,c:0};
    return { mid:mid, qi:i, q:q, w:st.w, c:st.c };
  });
  const wrong = shuffle(all.filter(function(x){ return x.w > 0; }));
  const fresh = shuffle(all.filter(function(x){ return x.w === 0 && x.c === 0; }));
  const done  = shuffle(all.filter(function(x){ return x.w === 0 && x.c > 0; }));
  return wrong.concat(fresh, done).slice(0, Math.min(n, all.length));
}
function pickDaily(n){
  let pool = [];
  MODULES.forEach(function(m){ pool = pool.concat(pickQuestions(m.id, m.Q.length)); });
  const wrong = shuffle(pool.filter(function(x){ return x.w > 0; }));
  const fresh = shuffle(pool.filter(function(x){ return x.w === 0 && x.c === 0; }));
  const done  = shuffle(pool.filter(function(x){ return x.w === 0 && x.c > 0; }));
  return wrong.concat(fresh, done).slice(0, n);
}
function masteredCount(mid){
  const mod = findMod(mid);
  let n = 0;
  for(let i=0;i<mod.Q.length;i++){
    const st = state.qstat[mid+'-'+i];
    if(st && st.c > 0) n++;
  }
  return n;
}

/* ============================================================
   渲染入口
   ============================================================ */
function render(){
  if(state.screen === 'home') return renderHome();
  if(state.screen === 'lesson') return renderLesson();
  if(state.screen === 'quiz') return renderQuiz();
  if(state.screen === 'result') return renderResult();
}

/* ---------- 首页 ---------- */
function renderHome(){
  let cards = '';
  MODULES.forEach(function(m){
    const done = masteredCount(m.id);
    const total = m.Q.length;
    const pct = Math.round(done/total*100);
    cards += '<button class="mod" data-mod="'+m.id+'" style="--c1:'+m.c1+';--c2:'+m.c2+';--cd:'+m.cd+'">'
      +  '<div class="mod-ico">'+m.ico+'</div>'
      +  '<div class="mod-name">'+esc(m.name)+'</div>'
      +  '<div class="mod-sub">'+esc(m.sub)+'</div>'
      +  '<div class="mod-bar"><i style="width:'+pct+'%"></i></div>'
      +  '<div class="mod-num">已掌握 '+done+' / '+total+'</div>'
      + '</button>';
  });

  const wrongTotal = (function(){
    let n = 0;
    Object.keys(state.qstat).forEach(function(k){ if(state.qstat[k].w > 0) n++; });
    return n;
  })();

  app.innerHTML = '<div class="screen">'
    + '<div class="top">'
    +   '<div class="top-title" style="font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:2px">句子小魔法</div>'
    +   '<div class="pill">⭐ <b>'+state.stars+'</b></div>'
    + '</div>'
    + '<div class="scroll">'
    +   '<div class="hello">'
    +     '<h1>今天也要<em>加油</em>哦</h1>'
    +     '<p>'+(wrongTotal > 0 ? '有 '+wrongTotal+' 道题在等你复习' : '每次 10 道题，5 分钟就够')+'</p>'
    +   '</div>'
    +   '<button class="task" id="daily">'
    +     mascot('happy','task-mascot')
    +     '<div class="task-txt">'
    +       '<div class="k">TODAY</div>'
    +       '<div class="v">今日任务</div>'
    +       '<div class="d">10 道小题 · 错题优先</div>'
    +     '</div>'
    +     '<div class="task-go"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>'
    +   '</button>'
    +   '<div class="sec"><span>知识地图</span><small>共 '+MODULES.reduce(function(a,m){return a+m.Q.length;},0)+' 道题</small></div>'
    +   '<div class="grid">'+cards+'</div>'
    +   '<div style="height:10px"></div>'
    + '</div>'
    + '</div>';

  document.getElementById('daily').onclick = function(){ sfxTap(); startDaily(); };
  app.querySelectorAll('.mod').forEach(function(el){
    el.onclick = function(){ sfxTap(); openModule(el.dataset.mod); };
  });
}

/* ---------- 讲解页 ---------- */
function openModule(id){
  state.mod = findMod(id);
  state.screen = 'lesson';
  render();
}

function renderLesson(){
  const m = state.mod;
  let body = '';
  m.L.forEach(function(l){
    let egs = '';
    (l.e || []).forEach(function(e){
      egs += '<div class="eg"><div class="en">'+esc(e[0])+'</div>'
        + (e[1] ? '<div class="cn">'+esc(e[1])+'</div>' : '') + '</div>';
    });
    body += '<div class="lcard"><h3>'+esc(l.h)+'</h3><p>'+esc(l.b)+'</p>'+egs+'</div>';
  });

  app.innerHTML = '<div class="screen" style="--c1:'+m.c1+';--c2:'+m.c2+';--cd:'+m.cd+'">'
    + '<div class="top">'
    +   '<button class="icon-btn" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>'
    +   '<div class="top-title">知识点讲解</div>'
    +   '<div class="pill">⭐ <b>'+state.stars+'</b></div>'
    + '</div>'
    + '<div class="scroll">'
    +   '<div class="lsn-head">'
    +     '<div class="tag">先看这里</div>'
    +     '<h2>'+esc(m.name)+'</h2>'
    +     '<p>'+esc(m.sub)+'</p>'
    +   '</div>'
    +   body
    + '</div>'
    + '<div class="foot"><button class="btn" id="go">开始练习</button></div>'
    + '</div>';

  document.getElementById('back').onclick = function(){ sfxTap(); state.screen='home'; render(); };
  document.getElementById('go').onclick = function(){ sfxTap(); startQuiz(m.id); };
}

/* ---------- 开始练习 ---------- */
function startQuiz(mid){
  state.session = { list: pickQuestions(mid, 10), idx:0, correct:0, wrongs:[], answered:false, cur:null, title:findMod(mid).name };
  state.combo = 0;
  state.screen = 'quiz';
  loadQ();
}
function startDaily(){
  state.session = { list: pickDaily(10), idx:0, correct:0, wrongs:[], answered:false, cur:null, title:'今日任务' };
  state.combo = 0;
  state.screen = 'quiz';
  loadQ();
}
function loadQ(){
  const s = state.session;
  const cur = s.list[s.idx];
  const q = cur.q;
  s.answered = false;
  s.cur = { picked:null, order:null, avail:[], chosen:[] };
  if(q.t === 'c') s.cur.order = shuffle(q.o.map(function(_,i){ return i; }));
  if(q.t === 'b') s.cur.avail = shuffle(q.tok.map(function(w,i){ return {id:i, w:w}; }));
  render();
}

/* ---------- 练习页 ---------- */
function renderQuiz(){
  const s = state.session;
  const cur = s.list[s.idx];
  const q = cur.q;
  const m = findMod(cur.mid);
  const total = s.list.length;

  let dots = '';
  for(let i=0;i<total;i++){
    dots += '<i class="'+(i < s.idx ? 'done' : (i === s.idx ? 'now' : ''))+'"></i>';
  }

  let inner = '';
  if(q.t === 'c'){
    inner += '<div class="opts" id="opts">';
    s.cur.order.forEach(function(oi, k){
      inner += '<button class="opt" data-i="'+oi+'"><span class="k">'
        + String.fromCharCode(65 + k) + '</span><span>'+esc(q.o[oi])+'</span></button>';
    });
    inner += '</div>';
  } else if(q.t === 'i'){
    inner += '<div class="answrap">'
      + '<input class="ansinput" id="ansInput" type="text" inputmode="latin" '
      + 'autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" '
      + 'placeholder="在这里输入答案…">'
      + '</div>'
      + '<div class="hintline" id="hintline">'
      +   '<button class="hintbtn" id="hintBtn">💡 提示</button>'
      +   '<span class="hinttxt" id="hintTxt"></span>'
      + '</div>';
  } else {
    inner += '<div class="slot" id="slot"></div><div class="bank" id="bank"></div>';
  }

  const sq = splitQ(q);

  app.innerHTML = '<div class="screen" style="--c1:'+m.c1+';--c2:'+m.c2+';--cd:'+m.cd+'">'
    + '<div class="top">'
    +   '<button class="icon-btn" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>'
    +   '<div class="dots">'+dots+'</div>'
    +   '<div class="pill">⭐ <b>'+state.stars+'</b></div>'
    + '</div>'
    + '<div class="qbody" id="qbody">'
    +   '<div class="qcard">'
    +     '<div class="qinst">'+esc(sq.inst)+'</div>'
    +     '<div class="qtext">'+nl(sq.body)+'</div>'
    +   '</div>'
    +   inner
    +   '<div class="cheat"><div class="cheat-in"><b>💡 本关要点</b>'
    +     m.L.slice(0, 3).map(function(l){ return '<div>· '+esc(l.h)+'</div>'; }).join('')
    +   '</div></div>'
    + '</div>'
    + '<div class="foot" id="foot"><button class="btn" id="footBtn">检查答案</button></div>'
    + '<div class="sheet" id="sheet"></div>'
    + '</div>';

  document.getElementById('back').onclick = function(){ sfxTap(); state.screen='home'; render(); };
  document.getElementById('footBtn').onclick = function(){
    if(s.answered) nextQ(); else check();
  };

  if(q.t === 'c'){
    app.querySelectorAll('.opt').forEach(function(el){
      el.onclick = function(){
        if(s.answered) return;
        s.cur.picked = parseInt(el.dataset.i, 10);
        app.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('wrong'); });
        el.classList.add('wrong');
        check();
      };
    });
  }
  if(q.t === 'i'){
    const inp = document.getElementById('ansInput');
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); check(); }
    });
    document.getElementById('hintBtn').onclick = function(){
      sfxTap();
      const first = q.a[0].split(' ')[0];
      document.getElementById('hintTxt').textContent = '首词是 “' + first + '”，一共 ' + q.a[0].split(' ').length + ' 个词';
    };
  }
  if(q.t === 'b') renderBank();
}

/* 题干形如「改成否定句：\n原句」，把指令和句子拆开显示 */
function splitQ(q){
  const i = q.q.indexOf('\n');
  if(i > 0){
    const first = q.q.slice(0, i);
    if(/：$/.test(first)) return { inst:first.slice(0, -1), body:q.q.slice(i+1) };
  }
  const def = q.t === 'c' ? '选一个正确答案' : (q.t === 'b' ? '点词块组句' : '写出答案');
  return { inst:def, body:q.q };
}

function renderBank(){
  const s = state.session;
  const slot = document.getElementById('slot');
  const bank = document.getElementById('bank');
  if(!slot || !bank) return;

  slot.innerHTML = s.cur.chosen.length
    ? s.cur.chosen.map(function(t){ return '<button class="tok on" data-side="s" data-id="'+t.id+'">'+esc(t.w)+'</button>'; }).join('')
    : '<span class="ph">点下面的词块，按顺序排好</span>';

  bank.innerHTML = s.cur.avail.map(function(t){
    return '<button class="tok" data-side="b" data-id="'+t.id+'">'+esc(t.w)+'</button>';
  }).join('');

  slot.querySelectorAll('.tok').forEach(function(el){
    el.onclick = function(){
      if(s.answered) return;
      sfxTap();
      const id = parseInt(el.dataset.id, 10);
      const i = s.cur.chosen.findIndex(function(t){ return t.id === id; });
      if(i < 0) return;
      s.cur.avail.push(s.cur.chosen.splice(i,1)[0]);
      renderBank();
    };
  });
  bank.querySelectorAll('.tok').forEach(function(el){
    el.onclick = function(){
      if(s.answered) return;
      sfxTap();
      const id = parseInt(el.dataset.id, 10);
      const i = s.cur.avail.findIndex(function(t){ return t.id === id; });
      if(i < 0) return;
      s.cur.chosen.push(s.cur.avail.splice(i,1)[0]);
      renderBank();
    };
  });
}

/* ---------- 判题 ---------- */
function check(){
  const s = state.session;
  if(s.answered) return;
  const cur = s.list[s.idx];
  const q = cur.q;
  let ok = false;

  if(q.t === 'c'){
    if(s.cur.picked === null){ toast('先选一个答案吧'); return; }
    ok = (s.cur.picked === q.a);
    app.querySelectorAll('.opt').forEach(function(el){
      const i = parseInt(el.dataset.i, 10);
      el.style.pointerEvents = 'none';
      if(i === q.a) el.classList.add('right');
      else if(i === s.cur.picked) el.classList.add('wrong');
      else el.classList.add('dim');
    });
    if(!ok){
      const bad = app.querySelector('.opt.wrong');
      if(bad){ bad.classList.add('shake'); }
    }
  }
  else if(q.t === 'i'){
    const inp = document.getElementById('ansInput');
    const v = inp.value.trim();
    if(!v){ toast('先写一写答案'); inp.focus(); return; }
    const u = norm(v);
    ok = q.a.some(function(a){ return norm(a) === u; });
    inp.disabled = true;
    const hl = document.getElementById('hintline');
    if(hl) hl.style.display = 'none';
    if(!ok) inp.classList.add('shake');
  }
  else {
    const text = s.cur.chosen.map(function(t){ return t.w; }).join(' ');
    if(!text){ toast('先点几个词块吧'); return; }
    const u = norm(text);
    ok = q.a.some(function(a){ return norm(a) === u; });
    app.querySelectorAll('.tok').forEach(function(t){ t.style.pointerEvents = 'none'; });
  }

  s.answered = true;
  record(cur.mid, cur.qi, ok);

  const rightAns = (q.t === 'c') ? q.o[q.a] : q.a[0];
  const shown = (q.t === 'c') ? rightAns : (rightAns.charAt(0).toUpperCase() + rightAns.slice(1)) + (q.s ? '' : '.');

  if(ok){
    s.correct++;
    state.stars++;
    state.combo++;
    if(state.combo >= 3) state.stars++;   // 连击奖励：额外 +1 星
    save('sm_stars', state.stars);
    sfxOk(); buzz(18);
    const ns = app.querySelector('.top .pill b');
    if(ns) ns.textContent = state.stars;
    const r = document.querySelector('.qcard').getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2);
    if(state.combo >= 3) showCombo(state.combo);
  } else {
    state.combo = 0;
    s.wrongs.push({ q:q.q.replace(/\n/g,' '), a:shown });
    sfxNo(); buzz([26,50,26]);
  }

  showSheet(ok, shown, q.tip, q.t !== 'c');

  const footBtn = document.getElementById('footBtn');
  footBtn.textContent = (s.idx === s.list.length - 1) ? '看看成绩' : '下一题';
  footBtn.classList.toggle('ok', ok);

  setTimeout(function(){
    const b = document.getElementById('qbody');
    if(b) b.scrollTop = b.scrollHeight;
  }, 60);
}

function record(mid, qi, ok){
  const k = mid + '-' + qi;
  const st = state.qstat[k] || {w:0,c:0};
  if(ok){ st.c++; } else { st.w++; }
  state.qstat[k] = st;
  save('sm_q', state.qstat);
}

function showSheet(ok, ansText, tip, showAns){
  const sheet = document.getElementById('sheet');
  const s = state.session;
  const isLast = (s.idx === s.list.length - 1);
  const bonus = (ok && state.combo >= 3)
    ? '<span class="up">连击 x'+state.combo+' · +2 ⭐</span>'
    : (ok ? '<span class="up">答对啦 · +1 ⭐</span>' : '<span>没关系，记住它</span>');

  sheet.innerHTML = '<div class="sheet-grip"></div>'
    + '<div class="sheet-head">'
    +   mascot(ok ? 'cheer' : 'sad', 'sheet-m')
    +   '<div class="sheet-t">'
    +     '<b>'+(ok ? pickPraise() : '差一点点')+'</b>'
    +     bonus
    +   '</div>'
    + '</div>'
    + '<div class="sheet-body">'
    +   (showAns && !ok ? '<div class="ans"><em>正确答案</em>'+esc(ansText)+'</div>' : '')
    +   esc(tip || '')
    + '</div>'
    + '<button class="btn '+(ok ? 'ok' : '')+'" id="sheetBtn">'+(isLast ? '看看成绩' : '继续')+'</button>';

  const foot = document.getElementById('foot');
  if(foot) foot.style.visibility = 'hidden';

  document.getElementById('sheetBtn').onclick = function(){ sfxTap(); nextQ(); };
  requestAnimationFrame(function(){ sheet.classList.add('show'); });
}

let praiseIdx = 0;
function pickPraise(){
  const p = ['太棒了！','答对啦！','真厉害！','就是这个！','完全正确！','厉害呀！'];
  praiseIdx = (praiseIdx + 1 + Math.floor(Math.random()*3)) % p.length;
  return p[praiseIdx];
}

function nextQ(){
  const s = state.session;
  const sheet = document.getElementById('sheet');
  if(sheet) sheet.classList.remove('show');
  if(s.idx < s.list.length - 1){
    setTimeout(function(){ s.idx++; loadQ(); }, 180);
  } else {
    setTimeout(finish, 200);
  }
}

/* ---------- 结果 ---------- */
function finish(){
  const s = state.session;
  const rate = Math.round(s.correct / s.list.length * 100);
  if(s.correct > (state.best[s.title] || 0)){ state.best[s.title] = s.correct; save('sm_best', state.best); }
  state.screen = 'result';
  sfxLevel();
  render();
}

function renderResult(){
  const s = state.session;
  const total = s.list.length;
  const rate = Math.round(s.correct/total*100);
  let mood = 'sad', title = '再试一次吧', sub = '错题会多出现几次，很快就能记住';
  if(rate === 100){ mood='cheer'; title='全部答对！'; sub='太厉害了，这一关你完全掌握了'; }
  else if(rate >= 80){ mood='happy'; title='非常棒！'; sub='就差一点点，再来一次就满分了'; }
  else if(rate >= 60){ mood='happy'; title='进步很明显'; sub='把错题再看一遍，下次一定更好'; }

  let wrongHtml = '';
  if(s.wrongs.length){
    wrongHtml = '<div class="rw-title">这几道题要再看一眼</div>';
    s.wrongs.forEach(function(w){
      wrongHtml += '<div class="rw"><div class="a">'+nl(w.q)+'</div><div class="b">✔ '+esc(w.a)+'</div></div>';
    });
  }

  app.innerHTML = '<div class="screen">'
    + '<div class="res">'
    +   mascot(mood, 'res-mascot')
    +   '<h2>'+title+'</h2>'
    +   '<p class="sub">'+sub+'</p>'
    +   '<div class="res-stats">'
    +     '<div class="stat"><b style="color:#22C79A">'+s.correct+'</b><span>答对</span></div>'
    +     '<div class="stat"><b style="color:#FF6B81">'+(total-s.correct)+'</b><span>答错</span></div>'
    +     '<div class="stat"><b style="color:#4C8DFF">'+rate+'%</b><span>正确率</span></div>'
    +   '</div>'
    +   wrongHtml
    + '</div>'
    + '<div class="foot"><div class="btn-row">'
    +   '<button class="btn ghost" id="homeBtn">回首页</button>'
    +   '<button class="btn" id="againBtn">'+(s.wrongs.length ? '再练一次' : '继续挑战')+'</button>'
    + '</div></div>'
    + '</div>';

  document.getElementById('homeBtn').onclick = function(){ sfxTap(); state.screen='home'; render(); };
  document.getElementById('againBtn').onclick = function(){
    sfxTap();
    if(s.title === '今日任务'){ startDaily(); return; }
    const first = s.list[0];
    if(first) startQuiz(first.mid); else { state.screen='home'; render(); }
  };
}

/* ---------- 启动 ---------- */
document.addEventListener('pointerdown', function once(){
  ac();
  document.removeEventListener('pointerdown', once);
});
render();
</script>
