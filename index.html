<script>
/* ------------------------------------------------------------
   设备判定：在样式表之前执行，避免「先按手机排版、再跳成 iPad」。
   命中任意一条就走 iPad 布局（<html class="ipad">）：
     · 真 iPad（iPadOS 13+ 会伪装成 MacIntel，靠触点数识别）
     · 网址带 ?ipad / #ipad，或页面名里有 ipad（index_ipad.html）
     · 任何触屏设备，且短边 ≥ 640px（安卓平板、Surface 之类）
   iPad 上还会标 .port / .land，横竖屏各用一套排版。
   ------------------------------------------------------------ */
(function () {
  var ua = navigator.userAgent;
  var hint = (location.search + location.hash + location.pathname).toLowerCase();
  var touchPad = window.matchMedia && matchMedia('(pointer:coarse)').matches
    && Math.min(screen.width, screen.height) >= 640;

  function param(k) {
    var m = new RegExp('[?&]' + k + '=([^&#]*)').exec(location.search + location.hash);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }

  /* ----------------------------------------------------------
     直达游戏（play.html / play-ipad.html 会带这些参数跳进来）
       ?play=1        打开就进闯关，不显示首页
       ?phone=1       强制手机布局（在 iPad 上调试手机版用）
       ?ipad=1        强制平板布局（下面那段原有判定会认）
       ?free=0        按正常规则扣 100⭐；默认 0 以外的值都当练习局
       ?who=Elaine    用哪份档案，不写就用这台设备上次用的，
                      再没有就默认 Elaine
     ---------------------------------------------------------- */
  var root = document.documentElement;
  var play = param('play') && param('play') !== '0';
  var forcePhone = param('phone') === '1' || param('mobile') === '1';

  if (play) {
    var saved = '';
    try { saved = localStorage.getItem('sm_profile') || ''; } catch (e) { /* 隐私模式 */ }
    var who = (param('who') || saved || 'Elaine').trim();
    if (!saved || param('who')) {
      try { localStorage.setItem('sm_profile', who); } catch (e) { /* ignore */ }
    }
    window.__SM_PLAY = { free: param('free') !== '0', who: who };
    root.classList.add('play-boot');
  } else {
    window.__SM_PLAY = null;
  }

  var pad = /ipad/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
    || /ipad/.test(hint)
    || !!touchPad;
  if (forcePhone) pad = false;

  if (pad) root.classList.add('ipad');

  function orient() {
    if (!pad) return;
    var land = window.innerWidth > window.innerHeight;
    root.classList.toggle('land', land);
    root.classList.toggle('port', !land);
  }
  orient();
  window.addEventListener('resize', orient);
  window.addEventListener('orientationchange', function () {
    setTimeout(orient, 120);
    setTimeout(orient, 400);   /* iOS 有时回调来得太早，再对一次 */
  });
})();
</script>

<style>
/* 直达模式：首页先藏着，别让它闪一下才被游戏盖住 */
html.play-boot #app { visibility: hidden; }
#bootVail { display: none; }
html.play-boot #bootVail {
  display: flex; position: fixed; inset: 0; z-index: 40;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  background: #0a1014; color: #e8eef5;
  font: 700 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  letter-spacing: .06em;
}
#bootVail .bv-sword { font-size: 30px; animation: bvSwing 1.1s ease-in-out infinite; }
#bootVail .bv-sub { font-size: 12px; font-weight: 600; color: #7d93a8; letter-spacing: .12em; }
@keyframes bvSwing {
  0%, 100% { transform: rotate(-14deg) translateY(0); }
  50%      { transform: rotate(10deg) translateY(-4px); }
}
@media (prefers-reduced-motion: reduce) { #bootVail .bv-sword { animation: none; } }
</style>

  <div class="bv-sub">词表加载中</div>
</div>

<!-- 学习档案：必须在 core.js 之前同步取回，否则首屏读到的会是空数据。
     取不到（没设名字 / 服务器没开）就退回 localStorage，不影响离线使用。 -->
<script>
(function () {
  var name = '';
  try { name = localStorage.getItem('sm_profile') || ''; } catch (e) { /* 隐私模式 */ }
  window.__SM_PROFILE = name;
  window.__SM_DATA = null;
  if (!name) return;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/profile?name=' + encodeURIComponent(name), false);
    x.send(null);
    var j = JSON.parse(x.responseText);
    if (!j || !j.ok) throw new Error('bad');
    window.__SM_DATA = j.data || {};
  } catch (e) {
    /* 服务器连不上就别假装有档案，老老实实用本机存储 */
    window.__SM_PROFILE = '';
    window.__SM_DATA = null;
  }
})();
</script>
