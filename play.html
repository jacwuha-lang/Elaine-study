<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="单词闯关">
<title>单词闯关</title>
<style>
  html, body { height: 100%; margin: 0; background: #0a1014; color: #e8eef5;
    font: 700 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; }
  a { color: #ffbe5c; }
</style>
<script>
/* ------------------------------------------------------------
   手机直达入口。
   真正的页面还是 index.html —— 布局、脚本、存档只有一份，
   这里只负责带上「打开就进闯关 + 手机布局」的参数跳过去。

   可加参数一起透传：
     ?who=Elaine2   换一份档案
     ?free=0        按正常规则扣 100⭐（默认练习局，不扣星不记分）

   想放到手机桌面：Safari 分享 → 添加到主屏幕，打开就是游戏。
   ------------------------------------------------------------ */
(function () {
  var q = location.search ? location.search.replace(/^\?/, '&') : '';
  location.replace('index.html?play=1&phone=1' + q);
})();
</script>
</head>
<body>
  <div>正在进入单词闯关…<br><a href="index.html?play=1&phone=1">没跳转就点这里</a></div>
</body>
</html>
